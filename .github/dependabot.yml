version: 2
updates:
  # One grouped PR a week keeps the noise down; majors still come in alone,
  # since the repo's rule is that they need a compatibility check first.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
