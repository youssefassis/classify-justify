[project]
name = "classify-justify"
version = "0.1.0"
description = "Train an X-ray defect classifier, explain it with many attribution methods, and measure whether the explanations can be trusted."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Youssef Assis" }]
keywords = ["explainable-ai", "xai", "attribution", "captum", "defect-detection", "x-ray"]

dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "captum>=0.7",
    "numpy>=1.24",
    "pillow>=10.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
cjust = "classify_justify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classify_justify"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]
